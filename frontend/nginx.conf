server {
    listen 80;
    server_name localhost ai-lab.local;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # MJPEG live stream — buffering MUST be off or the stream freezes
    location /api/stream {
        proxy_pass http://backend:8000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;           # critical: disable all buffering
        proxy_cache off;               # no caching for live stream
        proxy_read_timeout 3600s;      # keep connection alive (1 hour)
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # All other API endpoints (status, export-usb, reset)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy requests to JupyterLab
    location /jupyter/ {
        proxy_pass http://jupyter:8888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

